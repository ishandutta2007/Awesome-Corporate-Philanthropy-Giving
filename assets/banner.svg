<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Header Text Gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Card Glow Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #cbd5e1;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }

      /* Animated ambient glowing pulses */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes shimmer {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }

      .pulse-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .pulse-2 {
        animation: pulseGlow 9s ease-in-out infinite reverse;
        transform-origin: 1000px 260px;
      }
      .float-card-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .float-card-2 {
        animation: floatReverse 6s ease-in-out infinite;
      }
      .pulse-ring {
        stroke-dasharray: 20 10;
        animation: shimmer 25s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Ambient Background Spheres -->
  <circle class="pulse-1" cx="180" cy="90" r="140" fill="#38bdf8" filter="blur(60px)" />
  <circle class="pulse-2" cx="1020" cy="270" r="160" fill="#a855f7" filter="blur(70px)" />
  <circle cx="600" cy="180" r="110" fill="#ec4899" opacity="0.15" filter="blur(50px)" />

  <!-- Decorative Orbit Lines (Behind Text) -->
  <ellipse class="pulse-ring" cx="600" cy="180" rx="540" ry="140" fill="none" stroke="#475569" stroke-opacity="0.3" stroke-width="1.5" />
  <ellipse class="pulse-ring" cx="600" cy="180" rx="460" ry="110" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1" />

  <!-- Background Decorative Dynamic Cards (Placed to corners to keep foreground text 100% clear) -->
  <g class="float-card-1" opacity="0.85">
    <!-- Left Decorative Metric Pill -->
    <rect x="50" y="45" width="220" height="48" rx="24" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="74" cy="69" r="12" fill="#0284c7" />
    <text x="74" y="74" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">🤝</text>
    <text x="96" y="74" class="pill-text">1.4M+ Global Nonprofits</text>
  </g>

  <g class="float-card-2" opacity="0.85">
    <!-- Right Decorative Metric Pill -->
    <rect x="930" y="45" width="220" height="48" rx="24" fill="#1e293b" fill-opacity="0.8" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="954" cy="69" r="12" fill="#be185d" />
    <text x="954" y="74" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#ffffff">🎁</text>
    <text x="976" y="74" class="pill-text">Matching Gifts &amp; Grants</text>
  </g>

  <!-- FOREGROUND: Category Badge -->
  <g transform="translate(470, 48)">
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#312e81" stroke="#818cf8" stroke-width="1" />
    <circle cx="16" cy="16" r="6" fill="#38bdf8" />
    <text x="32" y="21" class="badge-text" fill="#a5b4fc">ENTERPRISE IMPACT &amp; CSR</text>
  </g>

  <!-- FOREGROUND: Main Title -->
  <text x="600" y="132" text-anchor="middle" class="title-text" fill="url(#textGradient)">
    Awesome Corporate Philanthropy &amp; Giving
  </text>

  <!-- FOREGROUND: Subtitle -->
  <text x="600" y="174" text-anchor="middle" class="subtitle-text">
    Curated Hub for Employee Giving, Volunteer Management &amp; Open Grant Automation
  </text>

  <!-- FOREGROUND: Feature Badges Row -->
  <g transform="translate(180, 220)">
    <!-- Feature 1: Employee Matching -->
    <g transform="translate(0, 0)">
      <rect width="190" height="52" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="26" r="14" fill="#0369a1" />
      <text x="28" y="31" font-size="14" text-anchor="middle" fill="#fff">💼</text>
      <text x="50" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Workplace Giving</text>
      <text x="50" y="41" font-family="sans-serif" font-size="11" fill="#94a3b8">Matching gifts &amp; payroll</text>
    </g>

    <!-- Feature 2: Volunteer Management -->
    <g transform="translate(210, 0)">
      <rect width="200" height="52" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="26" r="14" fill="#4338ca" />
      <text x="28" y="31" font-size="14" text-anchor="middle" fill="#fff">🌱</text>
      <text x="50" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Volunteer Portals</text>
      <text x="50" y="41" font-family="sans-serif" font-size="11" fill="#94a3b8">Virtual &amp; in-person tracking</text>
    </g>

    <!-- Feature 3: Grantmaking -->
    <g transform="translate(430, 0)">
      <rect width="200" height="52" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="26" r="14" fill="#701a75" />
      <text x="28" y="31" font-size="14" text-anchor="middle" fill="#fff">📊</text>
      <text x="50" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Grant Lifecycles</text>
      <text x="50" y="41" font-family="sans-serif" font-size="11" fill="#94a3b8">Review &amp; fund distribution</text>
    </g>

    <!-- Feature 4: Open Source -->
    <g transform="translate(650, 0)">
      <rect width="190" height="52" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="26" r="14" fill="#15803d" />
      <text x="28" y="31" font-size="14" text-anchor="middle" fill="#fff">⚡</text>
      <text x="50" y="24" font-family="sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Self-Hostable</text>
      <text x="50" y="41" font-family="sans-serif" font-size="11" fill="#94a3b8">FOSS CRMs &amp; tools</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#textGradient)" />
</svg>
